<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فصول الأرض - تحكم باليد</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: #000; }
        #info {
            position: absolute; top: 15px; right: 15px; color: #fff;
            background: rgba(0,0,0,0.6); padding: 10px 16px; border-radius: 8px;
            z-index: 100; text-align: right; font-size: 14px;
        }
        #season-label { font-size: 24px; font-weight: bold; color: #ffd700; }
        #status { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.7); font-size: 14px; z-index: 100; }
        video { display: none; }
    </style>
</head>
<body>
<div id="info">
    <div>الفصل: <span id="season-label">الربيع</span></div>
    <div style="font-size:12px; color:#aaa;">حرّك إصبع السبابة يميناً/يساراً</div>
</div>
<div id="status">جارٍ تشغيل الكاميرا...</div>
<video id="cam" playsinline muted></video>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "@mediapipe/hands": "https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js",
        "@mediapipe/camera_utils": "https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029074/camera_utils.js"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Hands } from '@mediapipe/hands';
import { Camera } from '@mediapipe/camera_utils';

// ===================== 1. مشهد Three.js =====================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050510);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(0, 6, 18);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0, 0);

// إضاءة
scene.add(new THREE.AmbientLight(0x333344, 1));
const sunLight = new THREE.PointLight(0xffeedd, 2.5, 0, 0);
sunLight.position.set(0, 0, 0);
scene.add(sunLight);

// الشمس
const sun = new THREE.Mesh(
    new THREE.SphereGeometry(1.5, 32, 32),
    new THREE.MeshBasicMaterial({ color: 0xffaa00 })
);
scene.add(sun);

// الأرض (مجموعة لضمان ثبات الميل)
const earthGroup = new THREE.Group();
earthGroup.rotation.z = THREE.MathUtils.degToRad(23.44);
const earth = new THREE.Mesh(
    new THREE.SphereGeometry(1.0, 48, 48),
    new THREE.MeshStandardMaterial({ color: 0x2d8a4e, roughness: 0.8 })
);
earthGroup.add(earth);
scene.add(earthGroup);

// مدار
const orbitR = 7;
const points = [];
for (let i = 0; i <= 128; i++) {
    const a = (i / 128) * Math.PI * 2;
    points.push(new THREE.Vector3(Math.cos(a) * orbitR, 0, Math.sin(a) * orbitR));
}
scene.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(points),
    new THREE.LineBasicMaterial({ color: 0x446688, transparent: true, opacity: 0.4 })
));

// صور الفصول (باستخدام Canvas بدلاً من تحميل ملفات خارجية)
function makeSeasonTexture(label, bgColor) {
    const c = document.createElement('canvas');
    c.width = 256; c.height = 256;
    const ctx = c.getContext('2d');
    ctx.fillStyle = bgColor;
    ctx.fillRect(0, 0, 256, 256);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 48px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, 128, 128);
    return new THREE.CanvasTexture(c);
}

const seasonTextures = {
    spring: makeSeasonTexture('🌷', '#90ee90'),
    summer: makeSeasonTexture('☀️', '#ffd700'),
    autumn: makeSeasonTexture('🍂', '#ff8c00'),
    winter: makeSeasonTexture('❄️', '#b0e0e6')
};

// لوحة عرض الفصل
const seasonPlane = new THREE.Mesh(
    new THREE.PlaneGeometry(3, 3),
    new THREE.MeshBasicMaterial({ map: seasonTextures.spring, transparent: true, side: THREE.DoubleSide })
);
seasonPlane.position.set(0, 4, 0);
scene.add(seasonPlane);

// ===================== 2. إيماءات اليد =====================
const videoEl = document.getElementById('cam');
const statusEl = document.getElementById('status');
const labelEl = document.getElementById('season-label');

let handX = null; // موضع إصبع السبابة X (0~1)
let currentSeason = 'spring';
const seasonOrder = ['spring', 'summer', 'autumn', 'winter'];
const seasonNamesAr = { spring: 'الربيع', summer: 'الصيف', autumn: 'الخريف', winter: 'الشتاء' };

// نقاط التبديل: عندما يعبر إصبع السبابة هذه القيم، يتغير الفصل
// 0.2 = أقصى اليسار (خريف)، 0.4 = شتاء، 0.6 = ربيع، 0.8 = صيف
const thresholds = [0.25, 0.45, 0.65, 0.85];
const thresholdToSeason = ['autumn', 'winter', 'spring', 'summer'];

function updateSeasonFromHand(x) {
    let idx = 0;
    for (let i = 0; i < thresholds.length; i++) {
        if (x >= thresholds[i]) idx = i;
    }
    const newSeason = thresholdToSeason[idx];
    if (newSeason !== currentSeason) {
        currentSeason = newSeason;
        seasonPlane.material.map = seasonTextures[newSeason];
        seasonPlane.material.needsUpdate = true;
        labelEl.textContent = seasonNamesAr[newSeason];
    }
}

// إعداد MediaPipe Hands
const hands = new Hands({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${file}`
});

hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 0, // 0 أسرع، 1 أدق
    minDetectionConfidence: 0.6,
    minTrackingConfidence: 0.5,
    selfieMode: true
});

hands.onResults((results) => {
    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const lm = results.multiHandLandmarks[0];
        const indexTip = lm[8]; // نقطة إصبع السبابة
        handX = indexTip.x; // 0 (يسار) ~ 1 (يمين)
        statusEl.textContent = `الإصبع: ${(handX * 100).toFixed(0)}%`;
        updateSeasonFromHand(handX);
    } else {
        statusEl.textContent = 'لم يتم اكتشاف يد — ارفع يدك أمام الكاميرا';
    }
});

// تشغيل الكاميرا
const mpCamera = new Camera(videoEl, {
    onFrame: async () => {
        await hands.send({ image: videoEl });
    },
    width: 640,
    height: 480
});
mpCamera.start().then(() => {
    statusEl.textContent = 'الكاميرا تعمل — حرّك إصبع السبابة';
}).catch((err) => {
    statusEl.textContent = 'فشل الوصول إلى الكاميرا: ' + err.message;
});

// ===================== 3. حلقة الرسم =====================
let time = 0;
function animate() {
    requestAnimationFrame(animate);
    time += 0.01;

    // تحريك الأرض على المدار بناءً على موضع اليد (أو تلقائياً إذا لم توجد يد)
    let t = handX !== null ? handX : (Math.sin(time * 0.3) * 0.5 + 0.5);
    const angle = t * Math.PI * 2;
    earthGroup.position.set(
        Math.cos(angle) * orbitR,
        0,
        Math.sin(angle) * orbitR
    );

    // دوران الأرض
    earth.rotation.y += 0.01;

    controls.update();
    renderer.render(scene, camera);
}
animate();

// تكييف الحجم
addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
