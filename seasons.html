<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أسباب الفصول - محاكاة تفاعلية</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; background: #000; }
        #info {
            position: absolute; top: 15px; right: 15px; color: white;
            background: rgba(0,0,0,0.6); padding: 12px 18px; border-radius: 10px;
            font-size: 16px; z-index: 100; text-align: right;
        }
        #info h2 { margin: 0 0 5px 0; font-size: 20px; color: #ffd700; }
        #season-label { font-size: 22px; font-weight: bold; color: #7ec8e3; }
        #controls {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px; z-index: 100; flex-wrap: wrap; justify-content: center;
        }
        button {
            padding: 12px 24px; border: none; border-radius: 30px; cursor: pointer;
            font-size: 16px; font-weight: bold; transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        button:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.4); }
        .spring { background: #90ee90; color: #1a5c1a; }
        .summer { background: #ffd700; color: #8b6914; }
        .autumn { background: #ff8c00; color: #5c2e00; }
        .winter { background: #b0e0e6; color: #2c5f6e; }
        .reset { background: #888; color: white; }
        #note {
            position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.6); font-size: 13px; z-index: 100;
            text-align: center; width: 90%;
        }
    </style>
</head>
<body>

<div id="info">
    <h2>🌍 أسباب حدوث الفصول</h2>
    <div>الفصل الحالي: <span id="season-label">الاعتدال الربيعي</span></div>
    <div style="font-size:13px; color:#aaa; margin-top:4px;">اسحب بالماوس للتدوير | عجلة التكبير/التصغير</div>
</div>

<div id="controls">
    <button class="spring" onclick="setSeason('spring')">🌷 الربيع</button>
    <button class="summer" onclick="setSeason('summer')">☀️ الصيف</button>
    <button class="autumn" onclick="setSeason('autumn')">🍂 الخريف</button>
    <button class="winter" onclick="setSeason('winter')">❄️ الشتاء</button>
    <button class="reset" onclick="resetView()">🔄 إعادة</button>
</div>

<div id="note">لاحظ كيف يميل محور الأرض في اتجاه ثابت أثناء دورانها حول الشمس — هذا هو سبب الفصول</div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ===== 场景基础 =====
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050510);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 8, 22);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 0, 0);
controls.maxPolarAngle = Math.PI / 2;
controls.minDistance = 8;
controls.maxDistance = 50;

// ===== 光源 =====
// 环境光（微弱，避免全黑）
const ambientLight = new THREE.AmbientLight(0x222233, 0.6);
scene.add(ambientLight);

// 太阳位置的点光源 —— 这是四季光照的核心
const sunLight = new THREE.PointLight(0xffeedd, 3, 0, 0);
sunLight.position.set(0, 0, 0);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 1024;
sunLight.shadow.mapSize.height = 1024;
scene.add(sunLight);

// ===== 星空背景 =====
const starGeometry = new THREE.BufferGeometry();
const starCount = 3000;
const starPositions = new Float32Array(starCount * 3);
for (let i = 0; i < starCount * 3; i += 3) {
    const r = 100 + Math.random() * 200;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    starPositions[i] = r * Math.sin(phi) * Math.cos(theta);
    starPositions[i+1] = r * Math.cos(phi);
    starPositions[i+2] = r * Math.sin(phi) * Math.sin(theta);
}
starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.5, transparent: true, opacity: 0.8 });
scene.add(new THREE.Points(starGeometry, starMaterial));

// ===== 太阳 =====
const sunGeometry = new THREE.SphereGeometry(1.8, 64, 64);
const sunMaterial = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
const sun = new THREE.Mesh(sunGeometry, sunMaterial);
scene.add(sun);

// 太阳光晕
const glowGeometry = new THREE.SphereGeometry(2.2, 32, 32);
const glowMaterial = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.2 });
scene.add(new THREE.Mesh(glowGeometry, glowMaterial));

// ===== 地球 =====
const earthGroup = new THREE.Group(); // 这个组负责整体倾斜和定位
const earthGeometry = new THREE.SphereGeometry(1.2, 64, 64);
const earthMaterial = new THREE.MeshStandardMaterial({
    map: createEarthTexture(),
    roughness: 0.8,
    metalness: 0.1
});
const earth = new THREE.Mesh(earthGeometry, earthMaterial);
earth.castShadow = true;
earth.receiveShadow = true;

// 地轴倾斜 23.44°（绕 Z 轴倾斜，方向固定）
earthGroup.rotation.z = THREE.MathUtils.degToRad(23.44);
earthGroup.add(earth);
scene.add(earthGroup);

// 地轴可视化（一条细线穿过地球）
const axisGeometry = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0, -2, 0),
    new THREE.Vector3(0, 2, 0)
]);
const axisLine = new THREE.Line(axisGeometry, new THREE.LineBasicMaterial({ color: 0xff6666 }));
earthGroup.add(axisLine);

// 地球纹理（程序生成，避免外部图片加载失败）
function createEarthTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 256;
    const ctx = canvas.getContext('2d');
    
    // 海洋底色
    ctx.fillStyle = '#1a4d7a';
    ctx.fillRect(0, 0, 512, 256);
    
    // 随机大陆色块（简化示意）
    ctx.fillStyle = '#2d8a4e';
    const continents = [
        [80, 60, 120, 80], [200, 40, 100, 60], [350, 80, 90, 100],
        [60, 150, 80, 60], [180, 140, 70, 90], [300, 160, 100, 70],
        [400, 50, 60, 80], [100, 200, 90, 40], [280, 30, 70, 50]
    ];
    continents.forEach(([x, y, w, h]) => {
        ctx.beginPath();
        ctx.ellipse(x, y, w/2, h/2, Math.random(), 0, Math.PI * 2);
        ctx.fill();
    });
    
    // 极地冰盖
    ctx.fillStyle = '#e8f4f8';
    ctx.fillRect(0, 0, 512, 25);
    ctx.fillRect(0, 231, 512, 25);
    
    const texture = new THREE.CanvasTexture(canvas);
    texture.colorSpace = THREE.SRGBColorSpace;
    return texture;
}

// ===== 公转轨道 =====
const orbitRadius = 8;
const orbitPoints = [];
for (let i = 0; i <= 128; i++) {
    const angle = (i / 128) * Math.PI * 2;
    orbitPoints.push(new THREE.Vector3(
        Math.cos(angle) * orbitRadius,
        0,
        Math.sin(angle) * orbitRadius
    ));
}
const orbitGeometry = new THREE.BufferGeometry().setFromPoints(orbitPoints);
const orbitLine = new THREE.Line(orbitGeometry, new THREE.LineBasicMaterial({ color: 0x446688, transparent: true, opacity: 0.5 }));
scene.add(orbitLine);

// ===== 季节位置数据 =====
// 角度定义：从太阳看向地球的方向
const seasons = {
    spring: { angle: 0,          name: 'الاعتدال الربيعي', label: '🌷 الربيع' },
    summer: { angle: Math.PI/2,  name: 'الانقلاب الصيفي',  label: '☀️ الصيف' },
    autumn: { angle: Math.PI,    name: 'الاعتدال الخريفي', label: '🍂 الخريف' },
    winter: { angle: Math.PI*3/2,name: 'الانقلاب الشتوي',  label: '❄️ الشتاء' }
};

let currentSeason = 'spring';

function updateEarthPosition(seasonKey) {
    const s = seasons[seasonKey];
    const x = Math.cos(s.angle) * orbitRadius;
    const z = Math.sin(s.angle) * orbitRadius;
    
    // 地球组的位置改变，但组本身的 Z 轴倾斜始终保持不变
    // 这就是"地轴指向固定方向"的关键：倾斜写在 group.rotation.z，位置写在 group.position
    earthGroup.position.set(x, 0, z);
    
    // 更新界面文字
    document.getElementById('season-label').textContent = s.label + ' — ' + s.name;
    currentSeason = seasonKey;
}

// 初始化到春季
updateEarthPosition('spring');

// ===== 交互按钮函数 =====
window.setSeason = function(seasonKey) {
    updateEarthPosition(seasonKey);
};

window.resetView = function() {
    camera.position.set(0, 8, 22);
    controls.target.set(0, 0, 0);
    updateEarthPosition('spring');
};

// ===== 动画循环 =====
let time = 0;
function animate() {
    requestAnimationFrame(animate);
    time += 0.01;
    
    // 地球自转（视觉上）
    earth.rotation.y += 0.005;
    
    // 太阳光晕脉动
    sun.scale.setScalar(1 + Math.sin(time * 2) * 0.02);
    
    controls.update();
    renderer.render(scene, camera);
}
animate();

// ===== 窗口自适应 =====
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
